<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">Lab4AI：开发目录与送审副本分离</title><desc id="desc">设计示意：将持续开发的工作资料与本次审核所依据的副本分开。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b6d75"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#16333d}.title{font-size:30px;font-weight:650}.sub{font-size:17px;fill:#52717a}.label{font-size:22px;font-weight:600}.small{font-size:18px;fill:#46636c}.box{fill:#fff;stroke:#abc5cb;stroke-width:1.5}.line{fill:none;stroke:#4b6d75;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="960" height="580" rx="20" fill="#f3f7f7"/>
<text x="40" y="55" class="title">Lab4AI：开发目录与送审副本分离</text>
<text x="40" y="87" class="sub">设计示意 · 持续开发与阶段验收</text>
<rect x="40" y="140" width="400" height="125" rx="12" class="box"/><text x="60" y="176" class="label">开发者工作目录</text><text x="60" y="208" class="small">代码、数据、模型与运行环境</text><text x="60" y="236" class="small">开发者继续修改原目录</text><rect x="520" y="140" width="400" height="125" rx="12" class="box"/><text x="540" y="176" class="label">提交动作</text><text x="540" y="208" class="small">提交时形成审核副本</text><text x="540" y="236" class="small">审核对象与工作资料分开</text><path d="M440 202 H515" class="line"/><rect x="520" y="325" width="400" height="125" rx="12" class="box"/><text x="540" y="361" class="label">本次审核所依据的副本</text><text x="540" y="393" class="small">审核面向本次复制的交付内容</text><text x="540" y="421" class="small">后续开发与审核对象逻辑分开</text><path d="M720 270 V318" class="line"/><text x="50" y="355" class="label">为什么分开？</text><text x="50" y="390" class="small">避免审核读取持续变化的工作文件；</text><text x="50" y="420" class="small">减少开发者另行打包上传的步骤。</text><text x="40" y="510" class="small">开发者继续修改工作资料，审核者检查本次提交的内容。</text><text x="40" y="542" class="small">设计取舍：明确审核对象，同时减少手动打包交接的操作。</text>
</svg>
