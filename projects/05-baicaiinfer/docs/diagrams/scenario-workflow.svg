<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">BaicaiInfer：把节点配置转成创作入口</title><desc id="desc">设计示意：创作选择与可复用场景配置的关系。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b6d75"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#16333d}.title{font-size:30px;font-weight:650}.sub{font-size:17px;fill:#52717a}.label{font-size:22px;font-weight:600}.small{font-size:18px;fill:#46636c}.box{fill:#fff;stroke:#abc5cb;stroke-width:1.5}.line{fill:none;stroke:#4b6d75;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="960" height="580" rx="20" fill="#f3f7f7"/>
<text x="40" y="55" class="title">BaicaiInfer：把节点配置转成创作入口</text>
<text x="40" y="87" class="sub">设计示意 · 创作任务与可复用配置</text>
<text x="40" y="132" class="small">创作者看到的任务入口</text><rect x="40" y="150" width="260" height="115" rx="12" class="box"/><text x="60" y="186" class="label">选择风格</text><text x="60" y="218" class="small">先选择需要的创作效果</text><rect x="350" y="150" width="260" height="115" rx="12" class="box"/><text x="370" y="186" class="label">输入素材</text><text x="370" y="218" class="small">提交参考图等素材</text><rect x="660" y="150" width="260" height="115" rx="12" class="box"/><text x="680" y="186" class="label">生成与检查</text><text x="680" y="218" class="small">查看结果，放大核对</text><path d="M300 206 H345" class="line"/><path d="M610 206 H655" class="line"/><text x="40" y="320" class="small">场景工作流承接的重复配置</text><rect x="40" y="340" width="260" height="115" rx="12" class="box"/><text x="60" y="376" class="label">模型与 LoRA</text><text x="60" y="408" class="small">按场景复用已有配置</text><rect x="350" y="340" width="260" height="115" rx="12" class="box"/><text x="370" y="376" class="label">节点与 Prompt</text><text x="370" y="408" class="small">封装 ComfyUI 操作</text><rect x="660" y="340" width="260" height="115" rx="12" class="box"/><text x="680" y="376" class="label">生成参数</text><text x="680" y="408" class="small">控制输入与结果生成</text><path d="M480 270 V332" class="line"/><text x="40" y="510" class="small">入口围绕创作目标组织选择，工作流承接可复用配置。</text><text x="40" y="542" class="small">设计取舍：降低操作负担，同时保留效果检查与调整空间。</text>
</svg>
